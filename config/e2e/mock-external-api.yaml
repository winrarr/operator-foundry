apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-external-api
  namespace: operator-foundry-e2e
  labels:
    app.kubernetes.io/name: mock-external-api
    app.kubernetes.io/part-of: operator-foundry-e2e
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mock-external-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mock-external-api
        app.kubernetes.io/part-of: operator-foundry-e2e
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: mock-external-api
        image: ghcr.io/winrarr/operator-foundry-mock-api:dev
        imagePullPolicy: IfNotPresent
        args:
        - --port=8080
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 2
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 5m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mock-external-api
  namespace: operator-foundry-e2e
  labels:
    app.kubernetes.io/name: mock-external-api
    app.kubernetes.io/part-of: operator-foundry-e2e
spec:
  selector:
    app.kubernetes.io/name: mock-external-api
  ports:
  - name: http
    port: 8080
    targetPort: http
