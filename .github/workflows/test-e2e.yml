name: Kind E2E

on:
  workflow_dispatch:
  pull_request:
    branches: [main, 'release/v*']
  push:
    branches: [main, 'release/v*']

permissions:
  contents: read

concurrency:
  group: kind-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kind:
    name: Kind cluster and installation
    runs-on: ubuntu-latest
    steps:
    - name: Check out the code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - name: Cache project tools
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: bin
        key: ${{ runner.os }}-operator-foundry-tools-${{ hashFiles('Makefile', 'go.mod', 'go.sum') }}
        restore-keys: |
          ${{ runner.os }}-operator-foundry-tools-
    - name: Cache Docker layers
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/.buildx-cache
        key: ${{ runner.os }}-operator-foundry-buildx-${{ hashFiles('Dockerfile', 'go.mod', 'go.sum') }}
        restore-keys: |
          ${{ runner.os }}-operator-foundry-buildx-
    - name: Run Kind E2E
      env:
        DOCKER_BUILD_CACHE_ARGS: >-
          --cache-from=type=local,src=${{ runner.temp }}/.buildx-cache
          --cache-to=type=local,dest=${{ runner.temp }}/.buildx-cache-new,mode=max
      run: make kind-e2e
    - name: Delete the Kind cluster
      if: always()
      run: make kind-down || true
    - name: Save Docker layers
      if: always()
      run: |
        if [ -d "$RUNNER_TEMP/.buildx-cache-new" ]; then
          rm -rf "$RUNNER_TEMP/.buildx-cache"
          mv "$RUNNER_TEMP/.buildx-cache-new" "$RUNNER_TEMP/.buildx-cache"
        fi
