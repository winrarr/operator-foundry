name: Security and Supply Chain

on:
  pull_request:
    branches: [main, 'release/v*']
  push:
    branches: [main, 'release/v*']
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Source vulnerability scan
    runs-on: ubuntu-latest
    steps:
    - name: Check out the code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
    - name: Cache vulnerability database
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/operator-foundry/trivy
        key: ${{ runner.os }}-operator-foundry-trivy-${{ hashFiles('go.mod', 'go.sum', 'Dockerfile') }}
        restore-keys: |
          ${{ runner.os }}-operator-foundry-trivy-
    - name: Scan source and manifests
      run: make vulnerability-scan

  image:
    name: Image vulnerability scan and SBOM
    runs-on: ubuntu-latest
    steps:
    - name: Check out the code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - name: Cache project tools
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: bin
        key: ${{ runner.os }}-operator-foundry-tools-${{ hashFiles('Makefile', 'go.mod', 'go.sum') }}
        restore-keys: |
          ${{ runner.os }}-operator-foundry-tools-
    - name: Cache Docker layers
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/.buildx-cache
        key: ${{ runner.os }}-operator-foundry-security-buildx-${{ hashFiles('Dockerfile', 'go.mod', 'go.sum') }}
        restore-keys: |
          ${{ runner.os }}-operator-foundry-security-buildx-
    - name: Build image for inspection
      env:
        IMG: local/operator-foundry:${{ github.sha }}
        DOCKER_BUILD_CACHE_ARGS: >-
          --cache-from=type=local,src=${{ runner.temp }}/.buildx-cache
          --cache-to=type=local,dest=${{ runner.temp }}/.buildx-cache-new,mode=max
      run: make docker-build
    - name: Generate image SBOM
      env:
        IMG: local/operator-foundry:${{ github.sha }}
        SBOM_FILE: dist/operator-foundry-image.sbom.spdx.json
      run: make image-sbom
    - name: Upload image SBOM
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: operator-foundry-image-sbom
        path: dist/operator-foundry-image.sbom.spdx.json
        if-no-files-found: error
    - name: Scan image
      env:
        IMG: local/operator-foundry:${{ github.sha }}
      run: make image-vulnerability-scan
    - name: Save Docker layers
      if: always()
      run: |
        if [ -d "$RUNNER_TEMP/.buildx-cache-new" ]; then
          rm -rf "$RUNNER_TEMP/.buildx-cache"
          mv "$RUNNER_TEMP/.buildx-cache-new" "$RUNNER_TEMP/.buildx-cache"
        fi
