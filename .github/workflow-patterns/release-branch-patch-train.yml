# Optional pattern. Keep this file outside .github/workflows until the
# repository has deliberately configured release branches and credentials.
name: Release branch patch train

on:
  workflow_dispatch:
    inputs:
      release_branch:
        description: Release branch to process, for example release/v0.1
        required: true
        type: string
      dry_run:
        description: Evaluate eligibility without committing or tagging
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  checks: read

jobs:
  patch-train:
    if: vars.RELEASE_PATCH_TRAIN_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Check out the selected release branch
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.release_branch }}
        fetch-depth: 0
        persist-credentials: false
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
    - name: Validate the branch before release automation
      env:
        RELEASE_BRANCH: ${{ inputs.release_branch }}
        DRY_RUN: ${{ inputs.dry_run }}
      run: |
        echo "Patch-train reference workflow for ${RELEASE_BRANCH}"
        echo "Implement repository-specific eligibility, checks, metadata, and recovery before enabling it."
        test "${DRY_RUN}" = true
