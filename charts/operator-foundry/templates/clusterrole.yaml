apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "operator-foundry.fullname" . }}-manager
  labels:
{{ include "operator-foundry.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - patterns.operator-foundry.example
  resources:
  - patternconnections
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - patterns.operator-foundry.example
  resources:
  - patternconnections/status
  - patternmemberships/status
  - patternresources/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - patterns.operator-foundry.example
  resources:
  - patternmemberships
  - patternresources
  verbs:
  - get
  - list
  - update
  - watch
- apiGroups:
  - patterns.operator-foundry.example
  resources:
  - patternmemberships/finalizers
  - patternresources/finalizers
  verbs:
  - update
