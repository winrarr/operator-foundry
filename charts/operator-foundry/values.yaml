image:
  repository: ghcr.io/winrarr/operator-foundry
  tag: dev
  digest: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

nameOverride: ""
fullnameOverride: ""

replicaCount: 1
leaderElection: true
enableHTTP2: false
healthProbeBindAddress: ":8081"

metrics:
  enabled: true
  secure: true
  port: 8443
  tls:
    # Existing kubernetes.io/tls Secret used by the secure metrics server.
    # When empty, controller-runtime generates a development certificate.
    certificateSecret: ""
  readerRole:
    create: true
    binding:
      # The chart cannot safely infer the Prometheus service account.
      create: false
      serviceAccount:
        name: ""
        namespace: ""
  serviceMonitor:
    enabled: false
    namespace: ""
    interval: 30s
    scrapeTimeout: 10s
    honorLabels: false
    labels: {}
    annotations: {}
    # Set to an empty string when providing another authorization mechanism.
    bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    tlsConfig:
      # The generated certificate is intended for development and testing.
      insecureSkipVerify: true
    relabelings: []
    metricRelabelings: []
    endpointAdditionalProperties: {}

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 128Mi

serviceAccount:
  create: true
  name: ""
  automountServiceAccountToken: true

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
