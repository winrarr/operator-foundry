[project]
site_name = "Operator Foundry"
site_description = "A reference-rich Kubernetes operator foundation for agents and maintainers."
site_author = "winrarr"
copyright = "Copyright © 2026 winrarr"
site_url = "https://winrarr.github.io/operator-foundry/"
docs_dir = "docs"
site_dir = "site"
repo_url = "https://github.com/winrarr/operator-foundry"
repo_name = "winrarr/operator-foundry"
edit_uri = "edit/main/docs/"
strict = true
nav = [
  { "Overview" = "index.md" },
  { "Product" = [
    { "Product direction" = "product.md" },
    { "User stories" = "user-stories.md" },
  ] },
  { "Patterns" = [
    { "Pattern catalog" = "patterns/index.md" },
    { "Status and conditions" = "patterns/status-and-conditions.md" },
    { "External clients" = "patterns/external-clients.md" },
    { "Lifecycle and ownership" = "patterns/lifecycle-and-ownership.md" },
    { "Dependencies and drift" = "patterns/dependencies-and-drift.md" },
    { "References and secrets" = "patterns/references-and-secrets.md" },
    { "Metrics and Prometheus" = "patterns/metrics-and-prometheus.md" },
    { "Supply-chain verification" = "patterns/supply-chain.md" },
    { "Kind and network-policy validation" = "patterns/kind-and-network-policy.md" },
    { "Optional release patch train" = "patterns/release-patch-train.md" },
  ] },
  { "Architecture" = [
    { "Architecture" = "architecture.md" },
    { "Decisions" = "decisions/index.md" },
  ] },
  { "Research" = [
    { "Research" = "research/index.md" },
    { "Reference operators" = "research/reference-operators.md" },
  ] },
  { "Reference" = [
    { "Verification" = "verification.md" },
    { "Generated API reference" = "reference/api.md" },
  ] },
  { "Operations" = [
    { "Operations" = "operations/index.md" },
    { "Local Kind" = "operations/kind.md" },
  ] },
  { "Contributing" = [
    { "Contributing" = "contributing/index.md" },
    { "Optional release automation" = "contributing/releases.md" },
  ] },
]

[project.theme]
features = [
  "navigation.instant",
  "navigation.tabs",
  "navigation.sections",
  "navigation.tracking",
  "navigation.top",
  "search.highlight",
  "search.suggest",
  "content.code.copy",
  "content.action.edit",
  "content.action.view",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.extra]
generator = false

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/winrarr/operator-foundry"

[project.validation]
invalid_links = true
invalid_link_anchors = true
